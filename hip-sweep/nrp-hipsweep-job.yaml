apiVersion: batch/v1
kind: Job
metadata:
  name: sorn-hipsweep-sweep
  namespace: hengenlab
spec:
  completionMode: Indexed
  completions: 250       # set to (number of h_ip values) x (runs per h_ip)
  parallelism: 50
  backoffLimitPerIndex: 2
  maxFailedIndexes: 20
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sorn
          image: seacore219/sorn-hipsweep-py2:cdad55d
          imagePullPolicy: Always
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: RUNS_PER_HIP
              value: "50"
            - name: HIP_VALUES
              value: "0.01,0.03,0.04,0.06,0.07"
            - name: SWEEP_LABEL
              value: "2026-09-22_hip0.01-0.07_step0.02"
          resources:
            requests: {cpu: "1", memory: "1Gi", ephemeral-storage: "4Gi"}
            limits: {cpu: "1", memory: "1Gi", ephemeral-storage: "4Gi"}
          volumeMounts:
            - {name: storage, mountPath: /opt/sorn/backup}
      volumes:
        - name: storage
          persistentVolumeClaim: {claimName: sorn-hipsweep-storage}