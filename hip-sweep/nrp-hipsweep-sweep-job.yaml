                                      - name: HIP_VALUES
              value: "0.01,0.03,0.04,0.06,0.07"
            - name            - name              - name       2_hip0.        step0                          - name      re            - name            - name emeral-storage: "4Gi"}
                                                    ral-storage: "4Gi"}
          volumeMounts:
          volumeMounts:
 age, mountPath: /opt/sorn/backup}
      volumes:
        - name: storage
          persistentVolumeClaim: {claimName: sorn-hipsweep-storage}
