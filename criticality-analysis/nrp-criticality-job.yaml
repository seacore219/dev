apiVersion: batch/v1
kind: Job
metadata:
  name: charlesd-criticality-analysis-fig2-try3
  namespace: hengenlab
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: analysis
          image: seacore219/criticality-analysis:latest
          imagePullPolicy: Always
          env:
            - name: SWEEP_ROOT
              value: /data
            - name: CONFIG_NAME
              value: ""
            - name: BATCH_GLOB
              value: "."
            - name: RUN_GLOB
              value: "n200-run-*"
            - name: ANALYSIS_WINDOW_START
              value: "2000000"
            - name: ANALYSIS_WINDOW_END
              value: "5000000"
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
              ephemeral-storage: "4Gi"
            limits:
              cpu: "1"
              memory: "4Gi"
              ephemeral-storage: "4Gi"
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: charlesd-sorn-fig2-py2-storage