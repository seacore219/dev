apiVersion: batch/v1
kind: Job
metadata:
  name: sorn-hipsweep-analysis
  namespace: hengenlab
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: analysis
          image: seacore219/criticality-analysis:latest
          imagePullPolicy: Always
          env:
            - name: SWEEP_ROOT
              value: /data
            - name: CONFIG_NAME
              value: "2026-09-17_hip0.08-0.20_step0.02"
            - name: BATCH_GLOB
              value: "h_ip_0.10"
            - name: RUN_GLOB
              value: "run-*"
            - name: ANALYSIS_WINDOW_START
              value: "2500000"
            - name: ANALYSIS_WINDOW_END
              value: "6000000"
          resources:
            requests: {cpu: "1", memory: "4Gi", ephemeral-storage: "4Gi"}
            limits: {cpu: "1", memory: "4Gi", ephemeral-storage: "4Gi"}
          volumeMounts:
            - {name: storage, mountPath: /data}
      volumes:
        - name: storage
          persistentVolumeClaim: {claimName: aw222-sorn-replication-storage}